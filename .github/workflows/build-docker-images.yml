name: Build FreqTrade-NostalgiaForInfinity Docker Images

on:
  workflow_dispatch:  # Manual trigger only

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        freqtrade_version:
          - "2025.10_freqaitorch"
          - "2025.9.1_freqaitorch"
        nfi_version:
          - "v17.2.12"
          - "v17.1.270"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=freqtrade-${{ matrix.freqtrade_version }}-nfi-${{ matrix.nfi_version }}
            type=raw,value=ft-${{ matrix.freqtrade_version }}-nfi-${{ matrix.nfi_version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FREQTRADE_VERSION=${{ matrix.freqtrade_version }}
            NFI_VERSION=${{ matrix.nfi_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
